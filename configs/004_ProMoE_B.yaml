model_name: "ProMoE_TC_B"

gpu_ids: [0]

###### For train
image_size: 256
total_train_batch_size: 1
lr: 0.0001
weight_decay: 0
use_pre_latents: True
resume_checkpoint: True
log_interval: 10

DiT_B_config:
  qk_norm: False
  MoE_config:
    num_routed_experts: 12
    moe_intermediate_size: 1536  # 768 // (1+1 shared) * mlp_ration (4)
    shared_expert_intermediate_size: 1536  # 768 // (1+1 shared) * mlp_ration (4)
    load_balance_loss_coef: 0.01
    norm_topk_prob: False
    seq_aux: False
    use_shared_expert: True
    interleave: True
    init_MoeMLP: False
    top_k: 2
    router_weight_mode: identity
    routing_contrastive_lam: 0
    use_top_k_for_routing_contrastive: True
    routing_contrastive_temperature: 0.07


###### For sample
step_list_for_sample: [1000, 50000, 100000, 500000]
# sample_every_step: 50000
num_fid_samples: 50000
sample_batch_size: 16
sample_steps: 50
sample_shift: 1.0
guide_scale_list: [4.0, 5.0, 7.0]
save_img_num: 50000
save_inception_features: False
warmup_steps: 1000

