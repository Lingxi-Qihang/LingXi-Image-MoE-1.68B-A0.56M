# Joint: 文生图 + 图片编辑 联合训练 (ProMoE_TC_L)
# 数据: preprocessed_all_moe (含 T2I + 编辑双任务特征)
model_name: "ProMoE_TC_L"

gpu_ids: [0]

image_size: 256
total_train_batch_size: 64
lr: 0.0001
weight_decay: 0
use_pre_latents: True
resume_checkpoint: True
resume_checkpoint_step: 0
num_steps: 1000000
log_interval: 10
save_ckpt_interval: 50000
output_dir: "ProMoE_L"


DiT_L_config:
  qk_norm: False
  MoE_config:
    num_routed_experts: 12
    moe_intermediate_size: 2048
    shared_expert_intermediate_size: 2048
    load_balance_loss_coef: 0.01
    norm_topk_prob: False
    seq_aux: False
    use_shared_expert: True
    interleave: True
    init_MoeMLP: False
    top_k: 2
    router_weight_mode: identity
    routing_contrastive_lam: 0
    use_top_k_for_routing_contrastive: True
    routing_contrastive_temperature: 0.07

step_list_for_sample: [1000, 50000, 100000, 500000]
num_fid_samples: 50000
sample_batch_size: 16
sample_steps: 50
sample_shift: 1.0
guide_scale_list: [4.0, 5.0, 7.0]
save_img_num: 50000
save_inception_features: False
warmup_steps: 1000

latent_root: "/data/coding/ma-xu-fine-t2i-preprocessed_all_moe/latents"
text_root: "/data/coding/ma-xu-fine-t2i-preprocessed_all_moe/t5_text_features"
